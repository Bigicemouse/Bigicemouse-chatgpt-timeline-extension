<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Timeline Navigator</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="tl-popup" aria-label="ChatGPT Timeline Navigator">
    <header class="tl-popup-title">ChatGPT Timeline Navigator</header>
    <section class="tl-popup-section" aria-label="插件">
      <label class="tl-popup-plugin">
        <span class="tl-popup-plugin-text">
          <span class="tl-popup-plugin-title">公式复制</span>
          <span class="tl-popup-plugin-desc">点击 GPT 公式复制 LaTeX</span>
        </span>
        <input id="tl-formula-copy-toggle" class="tl-popup-toggle-input" type="checkbox">
        <span class="tl-popup-toggle" aria-hidden="true"></span>
      </label>
      <label class="tl-popup-plugin">
        <span class="tl-popup-plugin-text">
          <span class="tl-popup-plugin-title">舒适阅读宽度</span>
          <span class="tl-popup-plugin-desc">只调整文本和输入框宽度</span>
        </span>
        <input id="tl-reading-width-toggle" class="tl-popup-toggle-input" type="checkbox">
        <span class="tl-popup-toggle" aria-hidden="true"></span>
      </label>
      <div class="tl-popup-slider-row">
        <label class="tl-popup-slider-label" for="tl-reading-width-slider">
          <span>阅读宽度（px）</span>
          <output id="tl-reading-width-value">1276</output>
        </label>
        <input id="tl-reading-width-slider" type="range" min="600" max="1600" step="1" value="1276">
        <div class="tl-popup-slider-hints" aria-hidden="true">
          <span>更窄</span>
          <span>更宽</span>
        </div>
      </div>
      <section class="tl-popup-export" aria-labelledby="tl-export-title">
        <div class="tl-popup-plugin-text">
          <h2 id="tl-export-title" class="tl-popup-plugin-title">对话导出</h2>
          <p class="tl-popup-plugin-desc">全部或选择对话，导出 JSON + Markdown</p>
          <p class="tl-popup-export-note">支持个人、项目、团队空间及增量备份</p>
        </div>
        <button id="tl-open-exporter" class="tl-popup-export-button" type="button">打开导出面板</button>
        <p id="tl-export-status" class="tl-popup-export-status" role="status" aria-live="polite" hidden></p>
      </section>
    </section>
  </main>
  <script src="./popup.js"></script>
</body>
</html>
