<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Timeline Navigator</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="tl-popup" aria-label="ChatGPT Timeline Navigator">
    <header class="tl-popup-title">ChatGPT Timeline Navigator</header>
    <section class="tl-popup-section" aria-label="宽度">
      <button type="button" class="tl-popup-option" data-layout-mode="default">
        <span>默认</span>
        <span class="tl-popup-dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="tl-popup-option" data-layout-mode="comfortable">
        <span>舒适</span>
        <span class="tl-popup-dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="tl-popup-option" data-layout-mode="wide">
        <span>宽屏</span>
        <span class="tl-popup-dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="tl-popup-option" data-layout-mode="full">
        <span>全宽</span>
        <span class="tl-popup-dot" aria-hidden="true"></span>
      </button>
    </section>
  </main>
  <script src="./popup.js"></script>
</body>
</html>
